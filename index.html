<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile Card</title>
  
  <!-- Imported 'Poppins' font for a modern, handcrafted typography feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      /* Soft pastel gradient with subtle grain feel */
      background: linear-gradient(120deg, #fef3c7, #fbcfe8, #f472b6);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Card Container with Glassmorphism Look */
    .profile-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 360px;
      padding: 36px 28px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 40px rgba(219, 39, 119, 0.12);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 48px rgba(219, 39, 119, 0.18);
    }

    /* Avatar Box & Status Indicator */
    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .status-dot {
      position: absolute;
      bottom: 4px;
      right: 6px;
      width: 14px;
      height: 14px;
      background-color: #10b981;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
    }

    /* Typography */
    .name {
      font-size: 1.4rem;
      font-weight: 700;
      color: #3b0764;
      letter-spacing: -0.3px;
      margin-bottom: 2px;
    }

    .title {
      font-size: 0.825rem;
      color: #db2777;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 0.875rem;
      color: #615d6c;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    /* Skill Badges */
    .skills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }

    .badge {
      background-color: #fff7ed;
      color: #9a3412;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 12px;
      border: 1px solid #ffedd5;
      transition: all 0.2s ease;
    }

    .badge:hover {
      background-color: #f472b6;
      border-color: #f472b6;
      color: #ffffff;
      transform: scale(1.05);
    }

    /* Button Layout Grid (2x2 Grid for 4 buttons) */
    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      font-size: 0.825rem;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Primary Highlight: Resume */
    .btn-primary {
      background-color: #ec4899;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.25);
    }

    .btn-primary:hover {
      background-color: #db2777;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.35);
    }

    /* Secondary Soft Buttons */
    .btn-secondary {
      background-color: #ffffff;
      color: #4c1d95;
      border: 1px solid #f3e8ff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .btn-secondary:hover {
      background-color: #faf5ff;
      border-color: #e9d5ff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <div class="avatar-wrapper">
      <img src="me.jpeg" alt="Reeshal Sandra" class="avatar">
      <span class="status-dot" title="Available for work"></span>
    </div>

    <h1 class="name">Reeshal Sandra Dmello</h1>
    <p class="title">Exploring Full Stack</p>
    <p class="bio">Learning and exploring frontend stack while simultaneously building projects along the way :)</p>

    <div class="skills">
      <span class="badge">HTML</span>
      <span class="badge">CSS</span>
      <span class="badge">JavaScript</span>
    <span class="badge">C/C++</span>
    <span class="badge">Python</span>
      <span class="badge">Git</span>
      <span class="badge">Github</span>
    </div>

    <!-- 4 Action Buttons Grid -->
    <div class="actions-grid">
      <!-- 1. Resume Link (Replace 'resume.pdf' with your file or link) -->
      <a href="Reeshal's resume (1).pdf" target="_blank" class="btn btn-primary">Resume</a>
      
      
      
      <!-- 3. GitHub Link -->
      <a href="https://github.com/Reeshal-sandra" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">GitHub</a>
      
      <!-- 4. LinkedIn Link -->
      <a href="https://www.linkedin.com/in/reeshal-sandra-dmello-469007352" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">LinkedIn</a>
    </div>
  </div>

</body>
</html>
